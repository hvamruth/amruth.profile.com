<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(-45deg, #55B7A8, #7fd8c9, #3fa79a, #a0e5da);
    background-size:400% 400%;
    animation: gradientMove 10s ease infinite;
}

@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.loader-container{
    text-align:center;
    color:white;
}

.loader-container h1{
    margin-bottom:20px;
    letter-spacing:2px;
}

.progress-bar{
    width:300px;
    height:12px;
    background: rgba(255,255,255,0.3);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

.progress{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, #ffffff, #55B7A8);
    border-radius:20px;
    animation: load 3s ease forwards;
}

@keyframes load{
    from{width:0%;}
    to{width:100%;}
}

.percentage{
    margin-top:15px;
    font-size:18px;
    font-weight:bold;
}

</style>
</head>
<body>

<div class="loader-container">
    <h1>Loading...</h1>
    <div class="progress-bar">
        <div class="progress"></div>
    </div>
    <div class="percentage" id="percent">0%</div>
</div>

<script>
let percent = 0;
let counter = document.getElementById("percent");

let interval = setInterval(() => {
    percent++;
    counter.innerText = percent + "%";
    if(percent >= 100){
        clearInterval(interval);
        // Redirect after loading (optional)
        // window.location.href = "index.html";
    }
}, 30);
</script>

</body>
</html>
