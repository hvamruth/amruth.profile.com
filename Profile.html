<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(-45deg, #667eea, #764ba2, #6dd5ed, #2193b0);
    background-size: 400% 400%;
    animation: gradientBG 10s ease infinite;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    color: white;
    width: 320px;
    animation: fadeIn 1.5s ease-in-out;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.profile-img {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid white;
    animation: float 4s ease-in-out infinite;
    transition: transform 0.3s ease;
}

.profile-img:hover {
    transform: scale(1.1);
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
    100% { transform: translateY(0px); }
}

h1 {
    margin-top: 20px;
    font-size: 24px;
}

p {
    margin-top: 10px;
    font-size: 14px;
    opacity: 0.9;
}

contact-section {
    margin-top: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 25px;
    background: white;
    color: #333;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #333;
    color: white;
}


.contact-section {
    text-align: center;
    margin-top: 40px;
}

/* Awesome Button */
.awesome-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 32px;
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(45deg, #25D366, #128C7E);
    border-radius: 50px;
    text-decoration: none;
    overflow: hidden;
    transition: all 0.4s ease;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
}

/* Hover Effect */
.awesome-btn:hover {
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
}

/* Click Effect */
.awesome-btn:active {
    transform: scale(0.95);
}

/* Shimmer Animation */
.awesome-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -75%;
    width: 50%;
    height: 100%;
    background: rgba(255, 255, 255, 0.3);
    transform: skewX(-25deg);
    transition: 0.75s;
}

.awesome-btn:hover::before {
    left: 125%;
}

/* Icon */
.awesome-btn .icon {
    font-size: 20px;
}

/* Pulse Animation */
@keyframes pulseGlow {
    0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6); }
    70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
    100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
}

.awesome-btn {
    animation: pulseGlow 2s infinite;
}

</style>
</head>

<body>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
<div class="card">
    <img src="img/79706293.jpeg" alt="Profile Photo" class="profile-img">
    <h1>Amruth Sagar HV</h1>
    <p>System Administrator | Linux Administrator | Security Researcher</p>
    <div class="contact-section">
    <a href="https://wa.me/919591478095" target="_blank" class="awesome-btn">
        <span class="icon">
            <i class="fab fa-whatsapp"></i>
        </span>
        <span class="text">Contact Me</span>
    </a>
</div>
</div>

</body>
</html>
