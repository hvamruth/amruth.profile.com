<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(-45deg, #667eea, #764ba2, #6dd5ed, #2193b0);
    background-size: 400% 400%;
    animation: gradientBG 10s ease infinite;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    color: white;
    width: 320px;
    animation: fadeIn 1.5s ease-in-out;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.profile-img {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid white;
    animation: float 4s ease-in-out infinite;
    transition: transform 0.3s ease;
}

.profile-img:hover {
    transform: scale(1.1);
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
    100% { transform: translateY(0px); }
}

h1 {
    margin-top: 20px;
    font-size: 24px;
}

p {
    margin-top: 10px;
    font-size: 14px;
    opacity: 0.9;
}

contact-section {
    margin-top: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 25px;
    background: white;
    color: #333;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #333;
    color: white;
}
</style>
</head>

<body>

<div class="card">
    <img src="img/79706293.jpeg" alt="Profile Photo" class="profile-img">
    <h1>Amruth Sagar HV</h1>
    <p>System Administrator | Linux Administrator | Security Researcher</p>
    <div class="contact-section">
                    <a href="https://wa.me/919591478095" class="btn btn-lg btn-hire wow animated zoomIn">Contact Me</a>
                </div>
</div>

</body>
</html>
