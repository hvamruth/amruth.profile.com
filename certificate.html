<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Certificates & Transcripts</title>

<style>
#securityPanel{
position:fixed;
top:20px;
right:20px;
width:320px;
font-family:Arial;
z-index:999999;
}

.alertBox{
background:#111;
color:#fff;
padding:16px;
margin-bottom:10px;
border-radius:10px;
border-left:6px solid #ff3b3b;
box-shadow:0 10px 30px rgba(0,0,0,.4);
animation:slide .3s ease;
position:relative;
}

.alertTitle{
font-weight:bold;
margin-bottom:5px;
}

.alertClose{
position:absolute;
top:5px;
right:10px;
cursor:pointer;
opacity:.7;
}

@keyframes slide{
from{transform:translateX(120%);opacity:0;}
to{transform:translateX(0);opacity:1;}
}
</style>

</head>
<body>

<div id="securityPanel"></div>

<script>

/* ALERT UI */

function securityAlert(title,message){

const panel=document.getElementById("securityPanel");

const box=document.createElement("div");
box.className="alertBox";

box.innerHTML=`
<div class="alertClose">✖</div>
<div class="alertTitle">🚨 ${title}</div>
<div>${message}</div>
`;

box.querySelector(".alertClose").onclick=()=>box.remove();

panel.appendChild(box);

setTimeout(()=>{
if(box.parentNode) box.remove();
},6000);

console.warn("SECURITY:",title,message);

}

/* USER-AGENT DETECTION */

(function(){

const ua=navigator.userAgent.toLowerCase();

const scanners=[
"zap",
"burp",
"nikto",
"sqlmap",
"dirbuster",
"nmap",
"acunetix",
"scanner",
"crawler"
];

scanners.forEach(tool=>{

if(ua.includes(tool)){

securityAlert(
"Scanner User-Agent",
"Possible vulnerability scanner detected"
);

}

});

})();

/* HEADLESS BROWSER DETECTION */

(function(){

if(navigator.webdriver){

securityAlert(
"Automation Detected",
"Selenium / automation browser detected"
);

}

if(!navigator.plugins.length){

securityAlert(
"Headless Browser",
"No browser plugins detected"
);

}

if(!navigator.languages){

securityAlert(
"Headless Environment",
"Missing language settings"
);

}

})();

/* HEADLESS CHROME */

if(/HeadlessChrome/.test(navigator.userAgent)){

securityAlert(
"Headless Chrome",
"Headless scanning browser detected"
);

}

/* BOT INTERACTION */

let actions=0;
let start=Date.now();

function monitor(){

actions++;

let elapsed=(Date.now()-start)/1000;

if(elapsed<4 && actions>60){

securityAlert(
"Bot Activity",
"Automated interaction detected"
);

actions=0;
start=Date.now();

}

if(elapsed>4){

actions=0;
start=Date.now();

}

}

["mousemove","click","keydown"].forEach(e=>{
document.addEventListener(e,monitor);
});

/* DEVTOOLS DETECTION */

setInterval(()=>{

const threshold=160;

if(
window.outerWidth-window.innerWidth>threshold ||
window.outerHeight-window.innerHeight>threshold
){

securityAlert(
"Developer Tools",
"DevTools may be open"
);

}

},5000);

</script>

</body>
</html>









<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certificates</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
scroll-behavior:smooth;
}

/* Animated Background */

body{
background:linear-gradient(135deg,#63d3c6,#42a9a0);
background-size:400% 400%;
animation:bgMove 10s infinite alternate;
}

@keyframes bgMove{
0%{background-position:left}
100%{background-position:right}
}

/* Back Button */

.back-modern{
position:fixed;
top:20px;
left:20px;
padding:12px 25px;
background:linear-gradient(45deg,#55B7A8,#7fd8c9);
color:white;
text-decoration:none;
border-radius:30px;
font-weight:bold;
box-shadow:0 5px 15px rgba(85,183,168,0.4);
transition:0.4s;
z-index:1000;
}

.back-modern:hover{
transform:scale(1.08);
box-shadow:0 10px 25px rgba(85,183,168,0.6);
}

/* Section */

.section{
width:90%;
max-width:1200px;
margin:auto;
text-align:center;
padding-top:80px;
}

/* Title */

.section h1{
color:white;
font-size:50px;
margin-bottom:40px;
animation:fadeDown 1s ease;
}

@keyframes fadeDown{
from{opacity:0;transform:translateY(-40px)}
to{opacity:1;transform:translateY(0)}
}

/* Slider */

.slider{
position:relative;
overflow:hidden;
}

.slide-track{
display:flex;
transition:transform .8s ease;
}

/* Certificate Card */

.slide{
min-width:320px;
margin:0 20px;
border-radius:18px;
overflow:hidden;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
box-shadow:0 10px 35px rgba(0,0,0,0.25);
transition:.4s;
}

.slide:hover{
transform:scale(1.08);
}

.slide img{
width:100%;
height:210px;
object-fit:cover;
}

.slide h3{
padding:18px;
color:white;
font-weight:500;
}

/* Buttons */

.btn{
position:absolute;
top:50%;
transform:translateY(-50%);
background:white;
border:none;
width:55px;
height:55px;
border-radius:50%;
font-size:26px;
cursor:pointer;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.btn:hover{
background:#42a9a0;
color:white;
}

.prev{left:-5px;}
.next{right:-5px;}

/* Down Arrow */

.scroll-down{
margin-top:40px;
font-size:40px;
color:white;
cursor:pointer;
animation:bounce 2s infinite;
}

@keyframes bounce{
0%,100%{transform:translateY(0)}
50%{transform:translateY(10px)}
}

/* Transcript Section */

.transcript-section{
margin-top:120px;
text-align:center;
}

.transcript-section h2{
color:white;
font-size:40px;
margin-bottom:40px;
}

/* A4 Paper Style */

.transcript{
width:794px;
height:1123px;
background:white;
margin:auto;
box-shadow:0 20px 40px rgba(0,0,0,0.4);
border-radius:6px;
overflow:hidden;
}

.transcript img{
width:100%;
height:100%;
object-fit:contain;
}

/* Responsive */

@media(max-width:900px){

.slide{min-width:260px;}

.transcript{
width:95%;
height:auto;
}

}

</style>
</head>

<body>

<a href="index.html" class="back-modern">← Back</a>

<div class="section">

<h1>Certificates</h1>

<div class="slider">

<button class="btn prev">&#10094;</button>

<div class="slide-track" id="track">

<div class="slide">
<img src="Certificates/EHE.jfif">
<h3>Ethical Hacking Essentials</h3>
</div>

<div class="slide">
<img src="Certificates/ceh.jfif">
<h3>Certified Ethical Hacker</h3>
</div>

<div class="slide">
<img src="Certificates/lna.jfif">
<h3>Linux Network Admin</h3>
</div>

<div class="slide">
<img src="Certificates/Comptia.jfif">
<h3>CompTIA Security+</h3>
</div>

<div class="slide">
<img src="Certificates/meity.jfif">
<h3>MEITY Certification</h3>
</div>

<div class="slide">
<img src="Certificates/SDES.jfif">
<h3>Software Development for Enterprise System</h3>
</div>

<div class="slide">
<img src="Certificates/ns.jfif">
<h3>Network Security</h3>
</div>

</div>

<button class="btn next">&#10095;</button>

</div>

<a href="#transcript">
<div class="scroll-down">⬇</div>
</a>

</div>

<!-- Transcript Section -->

<div id="transcript" class="transcript-section">

<h2>Academic Transcript</h2>

<div class="transcript">
<img src="Certificates/lnatrans.jfif">
</div>


<div class="transcript">
<img src="Certificates/comptrans.jfif">
</div>

</div>

<script>

const track=document.getElementById("track");
const slides=document.querySelectorAll(".slide");

let index=0;

function updateSlider(){

const width=slides[0].offsetWidth+40;

track.style.transform=
`translateX(${-index*width}px)`;

}

document.querySelector(".next").onclick=()=>{
index++;
if(index>=slides.length){index=0;}
updateSlider();
}

document.querySelector(".prev").onclick=()=>{
index--;
if(index<0){index=slides.length-1;}
updateSlider();
}

/* Auto slide */

setInterval(()=>{
index++;
if(index>=slides.length){index=0;}
updateSlider();
},3500);

</script>

</body>
</html>
