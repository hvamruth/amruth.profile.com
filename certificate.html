<script>
/*
=========================================
 ADVANCED CLIENT SECURITY MONITOR v2
 Modern Popup UI + Multi Detection Engine
=========================================
*/

(function(){

/* -------------------------------
   Security UI
--------------------------------*/

function createSecurityUI(){

if(document.getElementById("security-monitor-ui")) return;

const style = document.createElement("style");

style.innerHTML = `
#security-monitor-ui{
position:fixed;
top:20px;
right:20px;
width:340px;
z-index:999999;
font-family:system-ui;
}

.sec-alert{
background:rgba(20,20,20,0.9);
backdrop-filter:blur(10px);
border-radius:12px;
padding:16px;
margin-bottom:10px;
color:#fff;
box-shadow:0 10px 30px rgba(0,0,0,.5);
animation:slideIn .35s ease;
border-left:5px solid #ff4d4d;
}

.sec-alert.medium{border-color:#ffa500}
.sec-alert.low{border-color:#2ecc71}

.sec-title{
font-weight:600;
font-size:14px;
margin-bottom:6px;
}

.sec-msg{
font-size:13px;
opacity:.85;
}

.sec-close{
position:absolute;
right:10px;
top:8px;
cursor:pointer;
opacity:.7;
}

.sec-close:hover{opacity:1}

@keyframes slideIn{
from{
transform:translateX(120%);
opacity:0;
}
to{
transform:translateX(0);
opacity:1;
}
}
`;

document.head.appendChild(style);

const container = document.createElement("div");
container.id="security-monitor-ui";

document.body.appendChild(container);

}

createSecurityUI();

/* -------------------------------
   Alert System
--------------------------------*/

function showSecurityAlert(level,title,message){

const container = document.getElementById("security-monitor-ui");

const alert = document.createElement("div");
alert.className="sec-alert "+level;

alert.innerHTML = `
<div class="sec-close">✖</div>
<div class="sec-title">⚠ ${title}</div>
<div class="sec-msg">${message}</div>
`;

alert.querySelector(".sec-close").onclick = ()=>{
alert.remove();
};

container.appendChild(alert);

/* auto dismiss */

setTimeout(()=>{
alert.remove();
},8000);

/* console log */

console.warn("[SECURITY]",title,message);

}

/* -------------------------------
 Detection Engine
--------------------------------*/

const SecurityEngine = {

log:[],


report(level,title,msg){

this.log.push({
time:Date.now(),
title,
msg
});

showSecurityAlert(level,title,msg);

/* optional server reporting */

if(window.SECURITY_ENDPOINT){

fetch(window.SECURITY_ENDPOINT,{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({title,msg,level})
});

}

}

};

/* -------------------------------
 Scanner User-Agent Detection
--------------------------------*/

(function(){

const ua = navigator.userAgent.toLowerCase();

const scanners = [
"burp",
"zap",
"acunetix",
"nmap",
"nikto",
"sqlmap",
"dirbuster",
"dirb",
"wpscan",
"crawler",
"spider",
"scan"
];

scanners.forEach(tool=>{
if(ua.includes(tool)){

SecurityEngine.report(
"high",
"Scanner Detected",
"User-Agent matches known vulnerability scanner"
);

}
});

})();

/* -------------------------------
 Headless Browser Detection
--------------------------------*/

(function(){

if(navigator.webdriver){

SecurityEngine.report(
"high",
"Automation Detected",
"navigator.webdriver flag present"
);

}

if(!navigator.plugins.length){

SecurityEngine.report(
"medium",
"Headless Environment",
"No browser plugins detected"
);

}

if(!navigator.languages){

SecurityEngine.report(
"medium",
"Headless Indicator",
"Missing browser languages"
);

}

})();

/* -------------------------------
 DevTools Detection
--------------------------------*/

setInterval(()=>{

const threshold = 160;

if(window.outerWidth - window.innerWidth > threshold ||
window.outerHeight - window.innerHeight > threshold){

SecurityEngine.report(
"low",
"Developer Tools Open",
"DevTools panel detected"
);

}

},3000);

/* -------------------------------
 Automation Activity Detection
--------------------------------*/

let actionCount = 0;
let startTime = Date.now();

function monitorAction(){

actionCount++;

const elapsed = (Date.now() - startTime)/1000;

if(elapsed < 4 && actionCount > 50){

SecurityEngine.report(
"high",
"Automation Pattern",
"Abnormally fast interactions detected"
);

}

if(elapsed > 4){

actionCount = 0;
startTime = Date.now();

}

}

["mousemove","click","keydown","scroll"].forEach(evt=>{
document.addEventListener(evt,monitorAction);
});

/* -------------------------------
 Endpoint Enumeration Detection
--------------------------------*/

let navigationCount = 0;

window.addEventListener("hashchange",()=>{

navigationCount++;

if(navigationCount > 6){

SecurityEngine.report(
"medium",
"Endpoint Enumeration",
"Rapid navigation attempts detected"
);

}

});

/* -------------------------------
 Console Tampering Detection
--------------------------------*/

(function(){

const devtools = /./;

devtools.toString = function(){

SecurityEngine.report(
"medium",
"Console Inspection",
"Console object inspected"
);

};

console.log("%c",devtools);

})();

/* -------------------------------
 Debugger Trap
--------------------------------*/

setInterval(function(){

const start = performance.now();

debugger;

const diff = performance.now() - start;

if(diff > 100){

SecurityEngine.report(
"low",
"Debugger Detected",
"Execution paused by debugger"
);

}

},4000);

})();
</script>

<script>

const track=document.getElementById("track");
const slides=document.querySelectorAll(".slide");

let index=0;

function updateSlider(){

const width=slides[0].offsetWidth+40;

track.style.transform=
`translateX(${-index*width}px)`;

}

document.querySelector(".next").onclick=()=>{
index++;
if(index>=slides.length){index=0;}
updateSlider();
}

document.querySelector(".prev").onclick=()=>{
index--;
if(index<0){index=slides.length-1;}
updateSlider();
}

/* Auto slide */

setInterval(()=>{
index++;
if(index>=slides.length){index=0;}
updateSlider();
},3500);

</script>
