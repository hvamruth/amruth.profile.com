<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certificates</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
scroll-behavior:smooth;
}

/* Animated Background */

body{
background:linear-gradient(135deg,#63d3c6,#42a9a0);
background-size:400% 400%;
animation:bgMove 10s infinite alternate;
}

@keyframes bgMove{
0%{background-position:left}
100%{background-position:right}
}

/* Back Button */

.back-modern{
position:fixed;
top:20px;
left:20px;
padding:12px 25px;
background:linear-gradient(45deg,#55B7A8,#7fd8c9);
color:white;
text-decoration:none;
border-radius:30px;
font-weight:bold;
box-shadow:0 5px 15px rgba(85,183,168,0.4);
transition:0.4s;
z-index:1000;
}

.back-modern:hover{
transform:scale(1.08);
box-shadow:0 10px 25px rgba(85,183,168,0.6);
}

/* Section */

.section{
width:90%;
max-width:1200px;
margin:auto;
text-align:center;
padding-top:80px;
}

/* Title */

.section h1{
color:white;
font-size:50px;
margin-bottom:40px;
animation:fadeDown 1s ease;
}

@keyframes fadeDown{
from{opacity:0;transform:translateY(-40px)}
to{opacity:1;transform:translateY(0)}
}

/* Slider */

.slider{
position:relative;
overflow:hidden;
}

.slide-track{
display:flex;
transition:transform .8s ease;
}

/* Certificate Card */

.slide{
min-width:320px;
margin:0 20px;
border-radius:18px;
overflow:hidden;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
box-shadow:0 10px 35px rgba(0,0,0,0.25);
transition:.4s;
}

.slide:hover{
transform:scale(1.08);
}

.slide img{
width:100%;
height:210px;
object-fit:cover;
}

.slide h3{
padding:18px;
color:white;
font-weight:500;
}

/* Buttons */

.btn{
position:absolute;
top:50%;
transform:translateY(-50%);
background:white;
border:none;
width:55px;
height:55px;
border-radius:50%;
font-size:26px;
cursor:pointer;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.btn:hover{
background:#42a9a0;
color:white;
}

.prev{left:-5px;}
.next{right:-5px;}

/* Down Arrow */

.scroll-down{
margin-top:40px;
font-size:40px;
color:white;
cursor:pointer;
animation:bounce 2s infinite;
}

@keyframes bounce{
0%,100%{transform:translateY(0)}
50%{transform:translateY(10px)}
}

/* Transcript Section */

.transcript-section{
margin-top:120px;
text-align:center;
}

.transcript-section h2{
color:white;
font-size:40px;
margin-bottom:40px;
}

/* A4 Paper Style */

.transcript{
width:794px;
height:1123px;
background:white;
margin:auto;
box-shadow:0 20px 40px rgba(0,0,0,0.4);
border-radius:6px;
overflow:hidden;
}

.transcript img{
width:100%;
height:100%;
object-fit:contain;
}

/* Responsive */

@media(max-width:900px){

.slide{min-width:260px;}

.transcript{
width:95%;
height:auto;
}

}

</style>
</head>

<body>

<a href="index.html" class="back-modern">← Back</a>

<div class="section">

<h1>Certificates</h1>

<div class="slider">

<button class="btn prev">&#10094;</button>

<div class="slide-track" id="track">

<div class="slide">
<img src="Certificates/EHE.jfif">
<h3>Ethical Hacking Essentials</h3>
</div>

<div class="slide">
<img src="Certificates/ceh.jfif">
<h3>Certified Ethical Hacker</h3>
</div>

<div class="slide">
<img src="Certificates/lna.jfif">
<h3>Linux Network Admin</h3>
</div>

<div class="slide">
<img src="Certificates/Comptia.jfif">
<h3>CompTIA Security+</h3>
</div>

<div class="slide">
<img src="Certificates/meity.jfif">
<h3>MEITY Certification</h3>
</div>

<div class="slide">
<img src="Certificates/SDES.jfif">
<h3>Software Development for Enterprise System</h3>
</div>

<div class="slide">
<img src="Certificates/ns.jfif">
<h3>Network Security</h3>
</div>

</div>

<button class="btn next">&#10095;</button>

</div>

<a href="#transcript">
<div class="scroll-down">⬇</div>
</a>

</div>

<!-- Transcript Section -->

<div id="transcript" class="transcript-section">

<h2>Academic Transcript</h2>

<style>

/* Transcript container */

.transcript{
    width:794px;          /* A4 width */
    margin:60px auto;     /* space between transcripts */
    background:white;
    padding:20px;
    border-radius:8px;
    box-shadow:0 15px 35px rgba(0,0,0,0.25);
}

/* Image inside transcript */

.transcript img{
    width:100%;
    height:auto;
    display:block;
}

</style>


<div class="transcript">
<img src="Certificates/lnatrans.jfif">
</div>

<div class="transcript">
<img src="Certificates/comptrans.jfif">
</div>

<script>

const track=document.getElementById("track");
const slides=document.querySelectorAll(".slide");

let index=0;

function updateSlider(){

const width=slides[0].offsetWidth+40;

track.style.transform=
`translateX(${-index*width}px)`;

}

document.querySelector(".next").onclick=()=>{
index++;
if(index>=slides.length){index=0;}
updateSlider();
}

document.querySelector(".prev").onclick=()=>{
index--;
if(index<0){index=slides.length-1;}
updateSlider();
}

/* Auto slide */

setInterval(()=>{
index++;
if(index>=slides.length){index=0;}
updateSlider();
},3500);

</script>

</body>
</html>
