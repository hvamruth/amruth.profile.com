<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certificates</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#6ad1c5,#4bb3a7);
}

/* TITLE */

.section-title{
text-align:center;
color:white;
font-size:45px;
margin-top:40px;
}

/* SLIDER */

.slider-container{
width:85%;
margin:auto;
position:relative;
overflow:hidden;
padding:40px 0;
}

/* TRACK */

.slider{
display:flex;
transition:transform 0.6s ease;
}

/* CARD */

.slide{
min-width:300px;
margin:0 15px;
background:white;
border-radius:12px;
box-shadow:0 8px 25px rgba(0,0,0,0.2);
overflow:hidden;
transition:0.4s;
}

.slide:hover{
transform:scale(1.08);
}

/* IMAGE */

.slide img{
width:100%;
height:200px;
object-fit:cover;
}

/* TITLE */

.slide h3{
text-align:center;
padding:15px;
margin:0;
}

/* BUTTONS */

.btn{
position:absolute;
top:50%;
transform:translateY(-50%);
font-size:28px;
border:none;
background:white;
width:50px;
height:50px;
border-radius:50%;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.btn:hover{
background:#4bb3a7;
color:white;
}

.prev{
left:0;
}

.next{
right:0;
}

</style>
</head>

<body>

<h1 class="section-title">Certificates</h1>

<div class="slider-container">

<button class="btn prev">&#10094;</button>

<div class="slider" id="slider">

<div class="slide">
<img src="Certificates/EHE.jfif">
<h3>Ethical Hacking Essentials</h3>
</div>

<div class="slide">
<img src="Certificates/ceh.jfif">
<h3>Certified Ethical Hacker</h3>
</div>

<div class="slide">
<img src="Certificates/lna.jfif">
<h3>Linux Network Admin</h3>
</div>

<div class="slide">
<img src="Certificates/Comptia.jfif">
<h3>CompTIA Security+</h3>
</div>

<div class="slide">
<img src="Certificates/SDES.jfif">
<h3>Software Development for Enterprise System</h3>
</div>
  
<div class="slide">
<img src="Certificates/meity.jfif">
<h3>MEITY</h3>
</div>

</div>

<button class="btn next">&#10095;</button>

</div>


<script>

const slider = document.getElementById("slider");
const slides = document.querySelectorAll(".slide");

let index = 0;

function updateSlider(){
const slideWidth = slides[0].clientWidth + 30;
slider.style.transform = `translateX(${-index * slideWidth}px)`;
}

/* NEXT */

document.querySelector(".next").onclick = () => {

index++;

if(index >= slides.length){
index = 0;
}

updateSlider();

};

/* PREVIOUS */

document.querySelector(".prev").onclick = () => {

index--;

if(index < 0){
index = slides.length - 1;
}

updateSlider();

};

/* AUTO SLIDE */

setInterval(() => {

index++;

if(index >= slides.length){
index = 0;
}

updateSlider();

},3000);

</script>

</body>
</html>
