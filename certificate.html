<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificates</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
scroll-behavior:smooth;
}

body{
background:linear-gradient(135deg,#63d3c6,#42a9a0);
background-size:400% 400%;
animation:bgMove 10s infinite alternate;
}

@keyframes bgMove{
0%{background-position:left}
100%{background-position:right}
}

.back-modern{
position:fixed;
top:20px;
left:20px;
padding:12px 25px;
background:linear-gradient(45deg,#55B7A8,#7fd8c9);
color:white;
text-decoration:none;
border-radius:30px;
font-weight:bold;
z-index:1000;
}

/* Section */
.section{
width:90%;
max-width:1200px;
margin:auto;
text-align:center;
padding-top:80px;
}

.section h1{
color:white;
font-size:50px;
margin-bottom:40px;
}

/* Slider */
.slider{
position:relative;
overflow:hidden;
}

.slide-track{
display:flex;
transition:transform .8s ease;
}

.slide{
min-width:320px;
margin:0 20px;
border-radius:18px;
overflow:hidden;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
transition:0.4s;
}

.slide:hover{
transform:scale(1.05);
}

.slide img{
width:100%;
height:210px;
object-fit:cover;
}

.slide h3{
padding:18px;
color:white;
}

/* Buttons */
.btn{
position:absolute;
top:50%;
transform:translateY(-50%);
background:white;
border:none;
width:55px;
height:55px;
border-radius:50%;
font-size:26px;
cursor:pointer;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.prev{left:0;}
.next{right:0;}

/* Scroll Down Button */
.scroll-down{
margin-top:40px;
font-size:40px;
color:white;
cursor:pointer;
animation:bounce 2s infinite;
display:inline-block;
}

@keyframes bounce{
0%,100%{transform:translateY(0)}
50%{transform:translateY(10px)}
}

/* Transcript */
.transcript-section{
margin-top:120px;
text-align:center;
}

.transcript-section h2{
color:white;
font-size:40px;
margin-bottom:30px;
}

.transcript{
width:90%;
max-width:794px;
margin:20px auto;
}

.transcript img{
width:100%;
border-radius:10px;
}

/* Responsive */
@media(max-width:768px){
.slide{min-width:260px;}
}
</style>
</head>

<body>

<a href="index.html" class="back-modern">← Back</a>

<div class="section">
<h1>Certificates</h1>

<div class="slider">
<button class="btn prev">&#10094;</button>

<div class="slide-track" id="track">

<div class="slide">
<img src="Certificates/EHE.jfif">
<h3>Ethical Hacking Essentials</h3>
</div>

<div class="slide">
<img src="Certificates/ceh.jfif">
<h3>Certified Ethical Hacker</h3>
</div>

<div class="slide">
<img src="Certificates/lna.jfif">
<h3>Linux Network Admin</h3>
</div>

</div>

<button class="btn next">&#10095;</button>
</div>

<!-- Scroll Down Button -->
<a href="#transcript">
<div class="scroll-down">⬇</div>
</a>

</div>

<!-- Transcript Section -->
<div id="transcript" class="transcript-section">
<h2>Academic Transcript</h2>

<div class="transcript">
<img src="Certificates/lnatrans.jfif">
</div>

<div class="transcript">
<img src="Certificates/comptrans.jfif">
</div>

</div>

<script>
// Slider
const track = document.getElementById("track");
const slides = document.querySelectorAll(".slide");
let index = 0;

function updateSlider(){
    const width = slides[0].offsetWidth + 40;
    track.style.transform = `translateX(${-index * width}px)`;
}

document.querySelector(".next").onclick = () => {
    index = (index + 1) % slides.length;
    updateSlider();
};

document.querySelector(".prev").onclick = () => {
    index = (index - 1 + slides.length) % slides.length;
    updateSlider();
};

// Auto slide
setInterval(() => {
    index = (index + 1) % slides.length;
    updateSlider();
}, 3500);

// Visitor Info
async function getVisitorInfo() {
    let ip = "Unknown";
    let location = "Unknown";

    try {
        const res = await fetch("https://ipapi.co/json/");
        const data = await res.json();
        ip = data.ip;
        location = data.city + ", " + data.country_name;
    } catch {}

    const ua = navigator.userAgent;

    let browser = "Unknown";
    let os = "Unknown";
    let device = "Desktop";

    if (ua.includes("Chrome") && !ua.includes("Edg")) browser = "Chrome";
    else if (ua.includes("Safari") && !ua.includes("Chrome")) browser = "Safari";
    else if (ua.includes("Firefox")) browser = "Firefox";
    else if (ua.includes("Edg")) browser = "Edge";

    if (ua.includes("Windows")) os = "Windows";
    else if (ua.includes("Mac")) os = "MacOS";
    else if (ua.includes("Linux")) os = "Linux";
    else if (ua.includes("Android")) os = "Android";
    else if (ua.includes("iPhone") || ua.includes("iPad")) os = "iOS";

    if (/Mobi|Android|iPhone/i.test(ua)) device = "Mobile";

    alert(
        "Visitor Details:\n\n" +
        "IP: " + ip + "\n" +
        "Location: " + location + "\n\n" +
        "Browser: " + browser + "\n" +
        "OS: " + os + "\n" +
        "Device: " + device
    );
}

window.onload = getVisitorInfo;
</script>

</body>
</html>
