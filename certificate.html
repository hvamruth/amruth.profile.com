<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certificates</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#6ad1c5,#4bb3a7);
}

/* Section Title */

.section-title{
    text-align:center;
    color:white;
    font-size:45px;
    padding-top:40px;
    font-weight:bold;
}

/* Slider Container */

.slider-container{
    width:80%;
    margin:auto;
    overflow:hidden;
    position:relative;
    padding:40px 0;
}

/* Slide Track */

.slide-track{
    display:flex;
    transition:0.5s;
}

/* Individual Slide */

.slide{
    min-width:300px;
    margin:0 20px;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    transition:0.3s;
}

.slide:hover{
    transform:scale(1.05);
}

/* Image */

.slide img{
    width:100%;
    height:200px;
    object-fit:cover;
}

/* Certificate Title */

.slide h3{
    text-align:center;
    padding:15px;
    color:#333;
}

/* Buttons */

.prev, .next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:white;
    border:none;
    font-size:30px;
    padding:10px 18px;
    cursor:pointer;
    border-radius:50%;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.prev{ left:0; }
.next{ right:0; }

.prev:hover, .next:hover{
    background:#4bb3a7;
    color:white;
}

</style>
</head>

<body>

<h1 class="section-title">Certificates</h1>

<div class="slider-container">

<button class="prev" onclick="moveSlide(-1)">❮</button>

<div class="slide-track" id="slider">

<div class="slide">
<img src="/Certificates/ehe.jiff">
<h3>Ethical Hacking Essentials</h3>
</div>

<div class="slide">
<img src="cert2.jpg">
<h3>Networking Certification</h3>
</div>

<div class="slide">
<img src="cert3.jpg">
<h3>Ethical Hacking</h3>
</div>

<div class="slide">
<img src="cert4.jpg">
<h3>Cyber Security</h3>
</div>

<div class="slide">
<img src="cert5.jpg">
<h3>Cloud Fundamentals</h3>
</div>

</div>

<button class="next" onclick="moveSlide(1)">❯</button>

</div>


<script>

let slider = document.getElementById("slider");
let position = 0;

function moveSlide(step){
    position += step * 320;

    if(position > 0){
        position = 0;
    }

    if(position < -960){
        position = -960;
    }

    slider.style.transform = "translateX("+position+"px)";
}

/* Auto slide */

setInterval(()=>{
    moveSlide(1);
},3000);

</script>

</body>
</html>
