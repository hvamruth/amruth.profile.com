<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificates</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Segoe UI', sans-serif;
}

/* BACKGROUND */

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#63d3c6,#42a9a0);
overflow:hidden;
}

/* SECTION */

.section{
width:90%;
max-width:1200px;
text-align:center;
}

/* TITLE */

.section h1{
color:white;
font-size:50px;
margin-bottom:40px;
letter-spacing:2px;
animation:fadeDown 1s ease;
}

/* SLIDER */

.slider{
position:relative;
width:100%;
overflow:hidden;
}

/* TRACK */

.slide-track{
display:flex;
transition:transform .8s ease;
}

/* CARD */

.slide{
min-width:300px;
margin:0 20px;
border-radius:15px;
overflow:hidden;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(10px);
box-shadow:0 10px 30px rgba(0,0,0,0.2);
transition:0.4s;
}

/* HOVER EFFECT */

.slide:hover{
transform:scale(1.08);
box-shadow:0 20px 40px rgba(0,0,0,0.3);
}

/* IMAGE */

.slide img{
width:100%;
height:200px;
object-fit:cover;
}

/* TITLE */

.slide h3{
padding:15px;
color:white;
font-weight:500;
}

/* BUTTONS */

.btn{
position:absolute;
top:50%;
transform:translateY(-50%);
background:white;
border:none;
width:50px;
height:50px;
border-radius:50%;
font-size:25px;
cursor:pointer;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
transition:.3s;
}

.btn:hover{
background:#42a9a0;
color:white;
transform:translateY(-50%) scale(1.1);
}

.prev{
left:-10px;
}

.next{
right:-10px;
}

/* ANIMATIONS */

@keyframes fadeDown{

from{
opacity:0;
transform:translateY(-30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>
</head>

<body>

<div class="section">

<h1>Certificates</h1>

<div class="slider">

<button class="btn prev">&#10094;</button>

<div class="slide-track" id="track">

<div class="slide">
<img src="Certificates/EHE.jfif">
<h3>Ethical Hacking Essentials</h3>
</div>

<div class="slide">
<img src="Certificates/ceh.jfif">
<h3>Certified Ethical Hacker</h3>
</div>

<div class="slide">
<img src="Certificates/lna.jfif">
<h3>Linux Network Admin</h3>
</div>

<div class="slide">
<img src="Certificates/Comptia.jfif">
<h3>CompTIA Security+</h3>
</div>

<div class="slide">
<img src="Certificates/meity.jfif">
<h3>MEITY Certification</h3>

<div class="slide">
<img src="Certificates/SDES.jfif">
<h3>Software Development for Enterprise System</h3>
</div>

<div class="slide">
<img src="Certificates/ns.jfif">
<h3>Network Security</h3>

  
</div>

</div>

<button class="btn next">&#10095;</button>

</div>

</div>

<script>

const track = document.getElementById("track");
const slides = document.querySelectorAll(".slide");

let index = 0;

function updateSlider(){

const width = slides[0].offsetWidth + 40;

track.style.transform =
`translateX(${-index * width}px)`;

}

/* NEXT BUTTON */

document.querySelector(".next").onclick=()=>{

index++;

if(index >= slides.length){
index = 0;
}

updateSlider();

}

/* PREVIOUS BUTTON */

document.querySelector(".prev").onclick=()=>{

index--;

if(index < 0){
index = slides.length-1;
}

updateSlider();

}

/* AUTO SLIDE */

setInterval(()=>{

index++;

if(index >= slides.length){
index = 0;
}

updateSlider();

},3500);

/* MOBILE SWIPE */

let startX = 0;

track.addEventListener("touchstart",(e)=>{
startX = e.touches[0].clientX;
});

track.addEventListener("touchend",(e)=>{

let endX = e.changedTouches[0].clientX;

if(startX - endX > 50){

index++;
if(index >= slides.length) index = 0;

}

if(endX - startX > 50){

index--;
if(index < 0) index = slides.length-1;

}

updateSlider();

});

</script>

</body>
</html>
