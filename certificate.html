```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificates</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

/* Animated background */

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#63d3c6,#42a9a0);
background-size:400% 400%;
animation:bgMove 10s infinite alternate;
}

/* background animation */

@keyframes bgMove{
0%{background-position:left}
100%{background-position:right}
}

/* section */

.section{
width:90%;
max-width:1200px;
text-align:center;
}

/* title */

.section h1{
color:white;
font-size:50px;
margin-bottom:40px;
letter-spacing:2px;
animation:fadeDown 1s ease;
}

/* slider */

.slider{
position:relative;
width:100%;
overflow:hidden;
}

/* track */

.slide-track{
display:flex;
transition:transform .8s ease;
}

/* card */

.slide{
min-width:320px;
margin:0 20px;
border-radius:18px;
overflow:hidden;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
box-shadow:0 10px 35px rgba(0,0,0,0.25);
transition:all .4s;
}

/* hover animation */

.slide:hover{
transform:scale(1.08) translateY(-8px);
box-shadow:0 25px 50px rgba(0,0,0,0.35);
}

/* image */

.slide img{
width:100%;
height:210px;
object-fit:cover;
}

/* title */

.slide h3{
padding:18px;
color:white;
font-weight:500;
font-size:18px;
}

/* navigation buttons */

.btn{
position:absolute;
top:50%;
transform:translateY(-50%);
background:white;
border:none;
width:55px;
height:55px;
border-radius:50%;
font-size:26px;
cursor:pointer;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
transition:.3s;
}

.btn:hover{
background:#42a9a0;
color:white;
transform:translateY(-50%) scale(1.1);
}

.prev{
left:-5px;
}

.next{
right:-5px;
}

/* title animation */

@keyframes fadeDown{
from{
opacity:0;
transform:translateY(-40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* responsive */

@media(max-width:768px){

.slide{
min-width:260px;
}

.section h1{
font-size:36px;
}

}

</style>
</head>

<body>

<div class="section">

<h1>Certificates</h1>

<div class="slider">

<button class="btn prev">&#10094;</button>

<div class="slide-track" id="track">

<div class="slide">
<img src="Certificates/EHE.jfif">
<h3>Ethical Hacking Essentials</h3>
</div>

<div class="slide">
<img src="Certificates/ceh.jfif">
<h3>Certified Ethical Hacker</h3>
</div>

<div class="slide">
<img src="Certificates/lna.jfif">
<h3>Linux Network Admin</h3>
</div>

<div class="slide">
<img src="Certificates/Comptia.jfif">
<h3>CompTIA Security+</h3>
</div>

<div class="slide">
<img src="Certificates/meity.jfif">
<h3>MEITY Certification</h3>
</div>

<div class="slide">
<img src="Certificates/SDES.jfif">
<h3>Software Development for Enterprise System</h3>
</div>

<div class="slide">
<img src="Certificates/ns.jfif">
<h3>Network Security</h3>
</div>

</div>

<button class="btn next">&#10095;</button>

</div>

</div>

<script>

const track=document.getElementById("track");
const slides=document.querySelectorAll(".slide");

let index=0;

function updateSlider(){

const width=slides[0].offsetWidth+40;

track.style.transform=
`translateX(${-index*width}px)`;

}

/* next */

document.querySelector(".next").onclick=()=>{

index++;

if(index>=slides.length){
index=0;
}

updateSlider();

}

/* prev */

document.querySelector(".prev").onclick=()=>{

index--;

if(index<0){
index=slides.length-1;
}

updateSlider();

}

/* autoplay */

setInterval(()=>{

index++;

if(index>=slides.length){
index=0;
}

updateSlider();

},3500);

/* mobile swipe */

let startX=0;

track.addEventListener("touchstart",e=>{
startX=e.touches[0].clientX;
});

track.addEventListener("touchend",e=>{

let endX=e.changedTouches[0].clientX;

if(startX-endX>50){
index++;
}

if(endX-startX>50){
index--;
}

if(index>=slides.length) index=0;
if(index<0) index=slides.length-1;

updateSlider();

});

</script>

</body>
</html>
